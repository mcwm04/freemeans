[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freemeans-toolcheck"
version = "0.1.0"
description = "Validates the AI tools directory: data/tools/*.json and data/taxonomy.json."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema[format-nongpl]>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["toolcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
