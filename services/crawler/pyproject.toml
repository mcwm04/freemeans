[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freemeans-crawler"
version = "0.1.0"
description = "Discovery crawler for the Freemeans AI tools directory: find candidates, draft listings, queue them for review (PRD 7.1-7.4)."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Also needs the sibling packages, installed from the repo:
#   pip install ../toolcheck ../signals -e ".[dev]"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
