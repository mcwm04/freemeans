[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freemeans"
version = "0.1.0"
description = "Freemeans local agent: a free-aware, policy-checked router for your own free AI quotas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6",
  "jsonschema>=4.21",
  "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
freemeans = "freemeans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
