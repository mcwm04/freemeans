# Runs every test suite on each push and pull request. All free on GitHub Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  agent-and-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Agent tests + catalog validation
        working-directory: agent
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
          freemeans validate-catalog ../data/catalog/seed.json
      - name: Pipeline tests
        working-directory: services/pipeline
        run: |
          pip install pytest
          python -m pytest -q
      - name: Directory files (tool schema, taxonomy) + toolcheck tests
        working-directory: services/toolcheck
        run: |
          pip install -e ".[dev]"
          python -m toolcheck
          python -m pytest -q

  signals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Signal collector tests (fake network + real Postgres with all migrations)
        working-directory: services/signals
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Discovery crawler tests (fake network and LLM + real Postgres)
        working-directory: services/crawler
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
        run: |
          pip install -e ../toolcheck -e ../signals -e ".[dev]"
          python -m pytest -q

  web-api-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Database (migration + seed loader on PGlite)
        working-directory: db
        run: npm ci && npm test
      - name: API (Workers)
        working-directory: services/api
        run: npm ci && npm test && npm run check-bundle
      - name: Editor console (Workers)
        working-directory: services/admin
        run: npm ci && npm test && npm run check-bundle
      - name: Website (Astro build + checks)
        working-directory: apps/web
        run: npm ci && npm test
